name: Improvement
description: Planned work that is not a defect - design, tests, tooling, CI, release.
labels: ["enhancement"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - SDK - CPU scopes
        - SDK - GPU (D3D11)
        - IPC / serialization
        - Viewer
        - Tests
        - Build / release / CI
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing or costly today.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The change to make.
    validations:
      required: true

  - type: textarea
    id: files
    attributes:
      label: Files
      description: Files or directories likely to change.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable conditions that close this issue, including tests expected.
    validations:
      required: true

  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: Optional. Related work this issue should not include.
