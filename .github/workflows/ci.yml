name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    # The presets use the Visual Studio 17 2022 generator.
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: build/debug/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt', 'CMakePresets.json') }}

      - name: Configure
        run: cmake --preset debug

      - name: Build
        run: cmake --build build/debug --config Debug

      # Includes insights-test.single-process, which runs the whole suite shuffled
      # in one process to catch state leaking between tests (see CMakeLists.txt).
      - name: Test
        run: ctest --test-dir build/debug -C Debug --output-on-failure
